[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ikischema"
version = "0.1.0"
description = "Infer, compare, and validate data schemas"
readme = "README.MD"
requires-python = ">=3.10"
authors = [{name = "IkiDevz"}]

[project.scripts]
ikischema = "ikischema.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
